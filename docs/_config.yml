# GitHub Pages configuration.
#
# This is all GitHub's built-in Jekyll needs. Settings -> Pages -> Deploy from a
# branch -> main -> /docs, and the site builds from index.md on every push.
#
# `theme:` must be one of the themes GitHub Pages supports natively:
# https://pages.github.com/themes/ — anything else needs a full Actions build.
title: dsh-video-gen
description: >-
  A DeepSeek Harness plugin that renders video on the endpoint you already have.
theme: jekyll-theme-cayman

# Shown on the header button of the cayman theme.
show_downloads: false

exclude:
  - Gemfile
  - Gemfile.lock
