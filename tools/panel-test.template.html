<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>panel test</title>
<style>
  html, body { margin: 0; padding: 24px; background: #14161d; color: #e8eaf2; font: 13px/1.4 system-ui, sans-serif; }
  h2 { font-size: 14px; margin: 0 0 8px; }
  .card { background: #1d2029; border: 1px solid #2a2e3a; border-radius: 12px; padding: 14px; margin-bottom: 20px; max-width: 900px; }
  .chip { display: inline-block; background: #3a3f55; border-radius: 999px; padding: 2px 10px; font-size: 11px; margin-bottom: 8px; }
  pre { background: #0d0f14; border: 1px solid #2a2e3a; border-radius: 8px; padding: 10px; white-space: pre-wrap; font-size: 11px; max-height: 340px; overflow: auto; }
  #domdump { color: #9fd49f; }
  #errs { color: #ff9d9d; }
  .label { font-size: 11px; opacity: .6; margin: 8px 0 4px; }
  #shot { max-width: 900px; border-radius: 12px; margin-bottom: 20px; }
</style>
</head>
<body>
  <h2>dsh-video-gen panel QA harness</h2>

  <div class="card">
    <span class="chip">Rendering</span>
    <div>Cinematic deep-space shot: a slow, steady camera push through a vast nebula in Orion.</div>
    <div id="host1"></div>
  </div>

  <div class="card">
    <span class="chip">Queued</span>
    <div id="host2"></div>
  </div>

  <div class="label">errors / warnings</div>
  <pre id="errs"></pre>
  <div class="label">DOM state (after 2.5 s)</div>
  <pre id="domdump"></pre>

<script>/*__PANEL_JS__*/</script>
<script>/*__APP_JS__*/</script>
</body>
</html>
